<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Life Coach Website - Draft B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Nunito+Sans:wght@400;600&display=swap">
<style>*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg)}
ul{list-style:none;padding:0}
a{color:inherit}
.ph,.pl{background:var(--card) center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:14px;max-width:100%}
.ph.has span{display:none}
.btn{display:inline-block;padding:.75rem 1.4rem;background:var(--ac);color:var(--acfg,#fff);text-decoration:none;border-radius:var(--r,6px);font-weight:600;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 3px 12px rgba(0,0,0,.3)}
#adm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9;overflow:auto;padding:16px}
#adm.on{display:block}
#adm .box{background:var(--bg);color:var(--fg);max-width:560px;margin:0 auto;padding:20px;border-radius:10px;font:15px/1.4 system-ui,sans-serif;text-align:left}
#adm h2{font:600 20px system-ui,sans-serif;margin:0 0 4px}
#adm label{display:block;margin:12px 0 4px;font-weight:600;font-size:13px}
#adm input,#adm textarea{width:100%;padding:8px;border:1px solid var(--mut);background:transparent;color:inherit;border-radius:6px;font:inherit}
#adm textarea{min-height:90px}
#adm button{padding:8px 14px;margin:14px 8px 0 0;border:1px solid var(--mut);background:transparent;color:inherit;border-radius:6px;cursor:pointer;font:inherit}
#adm button.p{background:var(--ac);border-color:var(--ac);color:var(--acfg,#fff)}

:root{--bg:#f3f6f1;--fg:#233328;--card:#e2eadf;--mut:#5f7064;--ac:#3b6a50;--acfg:#fff;--r:999px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141c17;--fg:#e4ece6;--card:#212d25;--mut:#9aaca0;--ac:#7fc09b;--acfg:#0b1a11}}:root[data-theme=dark]{--bg:#141c17;--fg:#e4ece6;--card:#212d25;--mut:#9aaca0;--ac:#7fc09b;--acfg:#0b1a11}
body{font:17px/1.7 "Nunito Sans",system-ui,sans-serif;text-align:center}
[hidden]{display:none!important}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:600;line-height:1.25}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.top{padding:22px 0 8px}
.top b{display:block;font:600 1.2rem Lora,Georgia,serif;margin-bottom:12px}
.top nav{display:inline-flex;gap:4px;background:var(--card);padding:4px;border-radius:999px}
.top nav a{padding:.4rem 1.1rem;border-radius:999px;text-decoration:none;font-size:15px}
.top nav a.on{background:var(--bg)}
.ph{width:190px;height:190px;border-radius:50%;margin:32px auto 22px}
h1{font-size:clamp(1.9rem,5vw,2.6rem);margin-bottom:12px}
.sub{color:var(--mut);max-width:30em;margin:0 auto 24px}
h2{font-size:1.5rem;margin:56px 0 12px}
.l{text-align:left}
#exp{text-align:left}
#exp li{display:flex;gap:20px;padding:12px 0;border-bottom:1px solid var(--card)}
#exp b{min-width:52px;color:var(--ac)}
.pl{height:200px;border-radius:14px;margin:20px 0}
#courses{text-align:left}
#courses article{padding:18px 20px;border-left:3px solid var(--ac);background:var(--card);margin-bottom:12px}
#courses h3{font-size:1.15rem}
#courses p{color:var(--mut)}
.m{display:flex;justify-content:space-between;gap:16px;margin-top:4px;font-size:15px}.m b{color:var(--ac)}
footer{padding:48px 0 96px;font-size:14px;color:var(--mut)}
footer a{margin-left:16px}
</style></head><body><div class="wrap">
<div class="top"><b data-f="name"></b><nav><a href="#home">Home</a><a href="#academy">Academy and courses</a></nav></div>
<main id="pg-home">
<div class="ph"><span>Your photo</span></div>
<h1 data-f="head"></h1><p class="sub" data-f="tag"></p><a class="btn wa">Connect on WhatsApp</a>
<h2>About me</h2><p class="l" data-f="about"></p>
<h2>My experience</h2><ul id="exp"></ul>
</main>
<main id="pg-acad" hidden>
<h1 style="margin-top:40px">The coaching academy</h1><p class="l" data-f="acad"></p><div class="pl">Academy image</div>
<h2>Courses offered</h2><div id="courses"></div>
<p style="margin-top:28px"><a class="btn wa">Ask about a course on WhatsApp</a></p>
</main>
<footer><span data-f="name"></span><a href="#" class="adminlink">Admin</a></footer>
</div><a class="btn wa fab">Chat on WhatsApp</a>
<script>const DEF={name:'Asha Verma',head:'Clear thinking for your next step',tag:'Life coach and coach trainer. One-to-one coaching for individuals, and professional coaching training for people who want to coach others.',phone:'919999999999',about:'I work with people who feel stuck or stretched thin and want a clearer direction. Sessions are practical: honest questions, simple tools and a plan you can follow. This is sample text. Replace it with your own story and approach.',exp:'2012|Began career in corporate HR and people development\n2016|Completed professional coach certification\n2019|Started private coaching practice\n2022|Opened the coaching academy for new coaches\n2025|1,500+ coaching hours with 300+ clients',acad:'The academy trains aspiring coaches through live, practice-based programs. Batches are small, every learner coaches real people, and mentoring continues after certification. Sample text for the client to replace.',courses:'Foundations of Coaching|Core skills: listening, powerful questions and goal setting.|6 weeks|₹12,000\nProfessional Coach Certification|Full practicum, supervision and final assessment.|4 months|₹45,000\nCoaching for Leaders|Use coaching skills to lead and manage teams.|3 weeks|₹18,000\nPersonal Coaching|Private sessions on career, relationships and clarity.|3, 6 or 12 sessions|On request'};
const KEY=document.title,F=[['name','Name'],['head','Main headline'],['tag','Intro line','t'],['phone','WhatsApp number (with country code)'],['about','About me','t'],['exp','Experience: one per line as year | detail','t'],['acad','About the academy','t'],['courses','Courses: one per line as title | description | duration | price','t']];
let D={...DEF};try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const rows=t=>t.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(r=>r[0]);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
function render(){
$$('[data-f]').forEach(e=>e.textContent=D[e.dataset.f]);
$('#exp').innerHTML=rows(D.exp).map(r=>`<li><b>${esc(r[0])}</b><span>${esc(r[1])}</span></li>`).join('');
$('#courses').innerHTML=rows(D.courses).map(r=>`<article><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p><div class="m"><span>${esc(r[2])}</span><b>${esc(r[3])}</b></div></article>`).join('');
$$('.wa').forEach(a=>{a.href='https://wa.me/'+D.phone.replace(/\D/g,'')+'?text='+encodeURIComponent('Hi '+D.name+', I would like to connect.');a.target='_blank';a.rel='noopener'});
$$('.ph').forEach(p=>{p.style.backgroundImage=D.photo?`url(${D.photo})`:'';p.classList.toggle('has',!!D.photo)});
}
document.body.insertAdjacentHTML('beforeend','<div id="adm"><div class="box"></div></div>');
const box=$('#adm .box'),shut=()=>$('#adm').classList.remove('on');
function openAdm(){
$('#adm').classList.add('on');
box.innerHTML='<h2>Admin login</h2><label>Passcode (demo: admin123)</label><input type="password" id="pw"><button class="p" id="go">Unlock</button><button id="cl">Close</button>';
$('#cl').onclick=shut;
$('#go').onclick=()=>{if($('#pw').value==='admin123')form();else $('#pw').style.borderColor='red'};
}
function form(){
box.innerHTML='<h2>Edit website details</h2>'+F.map(([k,l,t])=>`<label>${l}</label>`+(t?`<textarea data-k="${k}">${esc(D[k])}</textarea>`:`<input data-k="${k}" value="${esc(D[k])}">`)).join('')+'<label>Profile photo</label><input type="file" accept="image/*" id="pf"><button class="p" id="sv">Save changes</button><button id="cl">Close</button><button id="rs">Reset to sample</button>';
$('#sv').onclick=()=>{box.querySelectorAll('[data-k]').forEach(x=>D[x.dataset.k]=x.value);save();render();shut()};
$('#cl').onclick=shut;
$('#rs').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
$('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,800/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);D.photo=c.toDataURL('image/jpeg',.8);save();render()};i.src=URL.createObjectURL(f)};
}
$$('.adminlink').forEach(a=>a.onclick=e=>{e.preventDefault();openAdm()});
render();

function route(){const a=location.hash==='#academy';$('#pg-home').hidden=a;$('#pg-acad').hidden=!a;$$('.top nav a').forEach(x=>x.classList.toggle('on',(x.hash==='#academy')===a));scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
