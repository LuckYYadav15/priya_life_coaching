<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priya Life Coaching — Sample websites</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    font: 17px/1.5 "Source Sans 3", system-ui, sans-serif;
    color: #1c2b33;
    background: #f4f7f7;
  }
  header {
    padding: 28px 24px 8px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    font: 600 clamp(1.6rem, 3vw, 2.2rem)/1.2 "Source Serif 4", Georgia, serif;
  }
  header p { color: #5d6f77; margin-top: 6px; max-width: 40em; }
  .list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    max-width: 1100px;
    margin: 24px auto 40px;
    padding: 0 24px;
  }
  button.card {
    text-align: left;
    border: 1px solid #d5e0e3;
    background: #fff;
    border-radius: 12px;
    padding: 18px 18px 16px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  button.card:hover, button.card:focus-visible {
    border-color: #0e6b6e;
    box-shadow: 0 6px 18px rgba(14, 107, 110, .12);
    outline: none;
  }
  button.card .label {
    font-size: 13px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #0e6b6e;
    font-weight: 600;
  }
  button.card h2 {
    font: 600 1.25rem/1.3 "Source Serif 4", Georgia, serif;
    margin: 6px 0 8px;
  }
  button.card p { color: #5d6f77; font-size: 15px; }
  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: #0f1719;
    z-index: 10;
    flex-direction: column;
  }
  .viewer.on { display: flex; }
  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    color: #e6eef0;
    background: #172226;
  }
  .bar strong { font-weight: 600; }
  .bar span { color: #93a6ad; font-size: 14px; flex: 1; }
  .bar a, .bar button {
    font: 600 14px/1 inherit;
    color: #06191a;
    background: #4cb8bb;
    border: 0;
    border-radius: 6px;
    padding: 8px 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .bar button.ghost {
    background: transparent;
    color: #e6eef0;
    border: 1px solid #3a4d53;
  }
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
    background: #fff;
  }
</style>
</head>
<body>
<header>
  <h1>Sample websites</h1>
  <p>Three drafts for the life coaching site. Open one to scroll, use the menus, and try the admin panel inside the preview.</p>
</header>
<div class="list" id="list"></div>
<div class="viewer" id="viewer">
  <div class="bar">
    <strong id="title"></strong>
    <span id="blurb"></span>
    <a id="open" href="#" target="_blank" rel="noopener">Open in new tab</a>
    <button type="button" class="ghost" id="back">Back to list</button>
  </div>
  <iframe id="frame" title="Sample website preview"></iframe>
</div>
<script>
const samples = [
  {
    file: "sample_draft_1.html",
    label: "Draft A",
    title: "Editorial",
    blurb: "Serif headlines, a photo beside the intro, and a long reading layout."
  },
  {
    file: "sample_draft_2.html",
    label: "Draft B",
    title: "Centered",
    blurb: "Soft green palette, rounded navigation, and a portrait in the middle."
  },
  {
    file: "sample_draft_3.html",
    label: "Draft C",
    title: "Bold",
    blurb: "Large type, a dark hero band, and a more graphic layout."
  }
];

const list = document.getElementById("list");
const viewer = document.getElementById("viewer");
const frame = document.getElementById("frame");

samples.forEach((sample) => {
  const button = document.createElement("button");
  button.className = "card";
  button.type = "button";
  button.innerHTML =
    `<div class="label">${sample.label}</div><h2>${sample.title}</h2><p>${sample.blurb}</p>`;
  button.addEventListener("click", () => openSample(sample));
  list.appendChild(button);
});

function openSample(sample) {
  document.getElementById("title").textContent = sample.label + " — " + sample.title;
  document.getElementById("blurb").textContent = sample.blurb;
  document.getElementById("open").href = sample.file;
  frame.src = sample.file;
  viewer.classList.add("on");
  history.pushState({ file: sample.file }, "", "#" + sample.file);
}

document.getElementById("back").addEventListener("click", closeViewer);

function closeViewer() {
  viewer.classList.remove("on");
  frame.src = "about:blank";
  if (location.hash) history.pushState(null, "", location.pathname);
}

window.addEventListener("popstate", () => {
  const file = location.hash.slice(1);
  const sample = samples.find((item) => item.file === file);
  if (sample) openSample(sample);
  else closeViewer();
});

if (location.hash) {
  const sample = samples.find((item) => item.file === location.hash.slice(1));
  if (sample) openSample(sample);
}
</script>
</body>
</html>
